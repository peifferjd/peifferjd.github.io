    Projects:
      - name: Single camera biomechanical human pose estimation
        summary: Accurately recovering human pose from a single camera could democratize access to biomechanical analysis and enable big data studies of human movement. My algorithms incorporate physical constraints to improve accuracy and interpretability.
        highlights:
          - Computer Vision
          - Deep Learning
          - Biomechanics
        start_date: 2025-06-23
        url: https://intelligentsensingandrehabilitation.github.io/MonocularBiomechanics/

      - name: Video-IMU fusion for human pose estimation
        summary: While video is a powerful and accessible sensor, it will always be limitied by occlusions. This work combines video and IMU data to improve accuracy and robustness of human pose estimation.
        highlights:
          - Computer Vision
          - Deep Learning
          - Sensor Fusion
        start_date: 2022-09-06
        end_date: 2024-10-04
