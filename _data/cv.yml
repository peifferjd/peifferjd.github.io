    Experience:
      - company: Center for Bionic Medicine, Shirley Ryan AbilityLab
        position: PhD Researcher
        start_date: 2022-09
        end_date: present
        location: Chicago, IL
        highlights:
          - Led first-author research in computer vision, sensor fusion, and biomechanical modeling for clinical AI, taking models from concept through validated clinical deployment; 15+ publications, >170 citations in <4 years.
          - Developed and released the Portable Biomechanics Laboratory — the first clinically validated single-camera smartphone gait analysis system, achieving <3° joint-angle error and ICC > 0.9 for derived gait biomarkers; first-author paper in npj Digital Medicine (Nature).
          - Deployed PBL to 3 external clinical sites (Shriners Children's, Lake Lucerne Institute), each of which published independent validation studies; demonstrated derived gait metrics detect surgical response in cervical myelopathy more sensitively than standard patient-reported outcomes.
          - Designed a neural-network fusion of uncalibrated IMU and monocular smartphone video, cutting knee angle error 26% while maintaining accuracy through visual occlusions.
          - Co-authored B3D, a feed-forward biomechanical prediction head on a frozen SAM-3D-Body foundation model, distilled label-free via differentiable MuJoCo physics; accepted to ECCV 2026 workshop.
          - Built multi-camera calibration and SAM-based pseudo-labeling pipelines, generating pseudo-ground-truth annotations to train and benchmark monocular scene reconstruction models; curated a 10,000-video clinical movement dataset for scene understanding model development.
          - Trained a contrastive learning + causal masking transformer on unannotated clinical gait data; demonstrated learned embeddings classify neurological diagnosis and track patient response to inpatient therapy.
      - company: Glove Sensing and Tracking Team, Meta Reality Labs
        position: Research Scientist Intern
        start_date: 2025-06
        end_date: 2026-02
        location: Redmond, WA
        highlights:
          - Implemented a real-time hand pose estimation and inverse-kinematics pipeline achieving <5 mm fingertip tracking error at 60 Hz with occlusion robustness across a 22-DoF hand model.
          - Trained a CNN+Transformer model on fiber-optic sensor data for direct hand pose regression, benchmarking learned pose estimation against an inverse-kinematics baseline.
          - Collected a dexterous-manipulation benchmarking dataset with motion-capture ground truth and authored production evaluation pipeline; first-author paper accepted to IROS 2026.
      - company: Neuromuscular Control & Biomechanics Laboratory, University of Alberta
        position: Fulbright-Mitacs Globalink Intern
        start_date: 2020-05
        end_date: 2020-08
        location: Alberta, CA
        highlights:
          - Computationally modeled seated human trunk biomechanics under Functional Electrical Stimulation (FES) and designed LQR and fuzzy inference (FIS) feedback controllers; validated closed-loop stability in simulation.
      - company: Neural Engineering Laboratory, University of Missouri
        position: Undergraduate Researcher
        start_date: 2020-08
        end_date: 2021-05
        location: Columbia, MO
        highlights:
          - Developed and optimized a closed-loop gamma oscillation detection and modulation algorithm achieving <2 ms latency on embedded hardware; open-sourced on [GitHub](https://github.com/jdpeiffer6/ClosedLoopGamma).
      - company: Pulmonary Imaging Research Laboratory, University of Missouri
        position: Undergraduate Researcher
        start_date: 2018-08
        end_date: 2021-05
        location: Columbia, MO
        highlights:
          - Built a semi-automated image segmentation, registration, and quantification pipeline enabling large-cohort comparison of 129Xe MRI vs. 99mTc SPECT; first-author publication in Academic Radiology (2024).
          - Won Audience Choice Award for oral presentation at International Workshop on Pulmonary Functional Imaging (2019).

