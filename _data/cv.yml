    Experience:
      - company: Meta Reality Labs
        position: Research Scientist Intern
        start_date: 2025-06
        end_date: 2026-02
        location: Redmond, WA
        highlights:
          - Implemented real-time C++ hand pose estimation and IK solver pipeline on the Glove Sensing and Tracking Team, achieving best-in-class accuracy and occlusion robustness for full dexterous hand pose capture.
          - Led algorithm development resulting in first-author IROS submission on a fiber optic sensing glove for high-performance dexterous manipulation capture.
      - company: Center for Bionic Medicine, Shirley Ryan AbilityLab
        position: PhD Researcher
        start_date: 2022-09
        end_date: present
        location: Chicago, IL
        highlights:
          - Designed and validated deep learning models for monocular biomechanical pose estimation and uncalibrated IMU–video sensor fusion, achieving joint angle errors <3° across neurological, prosthesis, and pediatric populations; 8 peer-reviewed publications. Developed OpenCV-based multi-camera calibration pipelines (intrinsic and extrinsic) for markerless motion capture deployment across clinical sites.
          - Developed the Portable Biomechanics Laboratory — a cloud-enabled smartphone gait analysis system achieving ICC > 0.9 for gait metrics and greater sensitivity to decompression surgery outcome than standard mJOA patient-reported outcomes.
          - Trained a contrastive learning + causal masking transformer on unannotated clinical gait data; demonstrated learned embeddings classify neurological diagnosis and track response to inpatient therapy.
      - company: Neuromuscular Control & Biomechanics Laboratory
        position: Fulbright-Mitacs Globalink Intern
        start_date: 2020-05
        end_date: 2020-08
        highlights:
          - Computationally modeled seated human trunk biomechanics under Functional Electrical Stimulation (FES) and designed LQR and fuzzy inference (FIS) feedback controllers; validated closed-loop stability in simulation.
      - company: MU Neural Engineering Laboratory
        position: Undergraduate Researcher
        start_date: 2020-08
        end_date: 2021-05
        location: Columbia, MO
        highlights:
          - Developed and optimized a closed-loop gamma oscillation detection and modulation algorithm achieving <2 ms latency on embedded hardware; open-sourced on [GitHub](https://github.com/jdpeiffer6/ClosedLoopGamma).
      - company: Pulmonary Imaging Research Laboratory, University of Missouri
        position: Undergraduate Researcher
        start_date: 2018-08
        end_date: 2021-05
        location: Columbia, MO
        highlights:
          - Built a semi-automated image segmentation, registration, and quantification pipeline enabling large-cohort comparison of 129Xe MRI vs. 99mTc SPECT; first-author publication in Academic Radiology (2024).
          - Received Audience Choice Award for oral presentation at International Workshop on Pulmonary Functional Imaging (2019).

