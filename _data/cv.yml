    Experience:
      - company: Center for Bionic Medicine, Shirley Ryan AbilityLab
        position: PhD Researcher
        start_date: 2022-09
        end_date: present
        location: Chicago, IL
        highlights:
          - Led end-to-end clinical AI research spanning computer vision, multimodal sensing, and biomechanical modeling, taking models from research through validated clinical deployment; produced 10 peer-reviewed publications (>145 citations in <4 years).
          - Developed and released the Portable Biomechanics Laboratory — the first clinically validated single-camera smartphone gait analysis system, achieving joint angle errors <3°, with derived biomarkers showing greater responsiveness to surgical intervention than standard outcomes; first-author paper in npj Digital Medicine (Nature). Deployed at external sites including Shriners Children's and the Lake Lucerne Institute, both of which published independent studies using it.
          - Designed a neural-network fusion of uncalibrated IMU and monocular smartphone video, cutting knee angle error 26% while maintaining accuracy through visual occlusions.
          - Built multi-camera calibration and SAM-based pseudo-labeling pipelines, generating pseudo-ground-truth annotations to train and benchmark monocular scene reconstruction.
          - Trained a contrastive learning + causal masking transformer on unannotated clinical gait data; demonstrated learned embeddings classify neurological diagnosis and track patient response to inpatient therapy.
          - Coordinated study design and protocol development across >300 participants at 3 external sites with neurosurgeons, physiotherapists, and engineers; mentored master's students and provided technical direction to engineers and post-doctoral researchers.
          - Presented research through invited podium presentations to the scientific community and to life-sciences partners including Eli Lilly.
      - company: Meta Reality Labs — Glove Sensing and Tracking Team
        position: Research Scientist Intern
        start_date: 2025-06
        end_date: 2026-02
        location: Redmond, WA
        highlights:
          - Implemented a real-time C++ hand pose estimation and IK solver pipeline, achieving best-in-class accuracy and occlusion robustness for full hand pose estimation during dexterous manipulation.
          - Trained a CNN+Transformer model on sensor data for data-driven accuracy evlauation; deployed to cloud servers for evaluation. 
          - Coordinated data collection and benchmarking dataset design for sensing glove, resulting in a first-author IROS paper on high-performance dexterous manipulation capture.
      - company: Neuromuscular Control & Biomechanics Laboratory
        position: Fulbright-Mitacs Globalink Intern
        start_date: 2020-05
        end_date: 2020-08
        highlights:
          - Computationally modeled seated human trunk biomechanics under Functional Electrical Stimulation (FES) and designed LQR and fuzzy inference (FIS) feedback controllers; validated closed-loop stability in simulation.
      - company: MU Neural Engineering Laboratory
        position: Undergraduate Researcher
        start_date: 2020-08
        end_date: 2021-05
        location: Columbia, MO
        highlights:
          - Developed and optimized a closed-loop gamma oscillation detection and modulation algorithm achieving <2 ms latency on embedded hardware; open-sourced on [GitHub](https://github.com/jdpeiffer6/ClosedLoopGamma).
      - company: Pulmonary Imaging Research Laboratory, University of Missouri
        position: Undergraduate Researcher
        start_date: 2018-08
        end_date: 2021-05
